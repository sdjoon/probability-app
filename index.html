<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#007aff"><link rel="manifest" href="manifest.json"><title>확률 실험기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:560px;margin:auto;padding:20px 16px 40px}h1{font-size:29px}.sub,.note{color:#777;font-size:13px;line-height:1.5}.card{background:white;border-radius:18px;padding:18px;margin:12px 0}label{display:block;color:#666;font-size:14px;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:22px}button{border:0;border-radius:13px;padding:14px;margin-top:9px;font-size:17px;font-weight:700;width:100%}.primary{background:#07f;color:white}.secondary{background:#e9e9ee}.result{text-align:center;font-size:44px;font-weight:900;padding:13px}.success{color:#16a34a}.failure{color:#dc2626}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7f7f8;border-radius:13px;padding:13px}.k{font-size:12px;color:#777}.v{font-size:22px;font-weight:800;margin-top:4px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid #eee}.history{max-height:260px;overflow:auto}.auto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.auto button{margin:0;font-size:14px;padding:12px}.bar{height:12px;background:#eee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#07f;width:0%}
</style></head><body><main>
<h1>🎲 확률 실험기</h1><div class="sub">성공 확률을 설정하고 성공까지 몇 번 걸렸는지 확인해 보세요.</div>
<div class="card"><label>성공 확률 (%)</label><input id="prob" type="number" min="0" max="100" step="0.1" value="5" inputmode="decimal"><button id="go" class="primary">추첨하기</button><div class="auto"><button data-n="10">10회</button><button data-n="100">100회</button><button data-n="1000">1,000회</button></div><button id="reset" class="secondary">초기화</button></div>
<div class="card"><div id="result" class="result">대기 중</div><div class="grid">
<div class="stat"><div class="k">총 횟수</div><div id="total" class="v">0</div></div><div class="stat"><div class="k">성공</div><div id="wins" class="v">0</div></div>
<div class="stat"><div class="k">실패</div><div id="losses" class="v">0</div></div><div class="stat"><div class="k">실제 성공률</div><div id="rate" class="v">0%</div></div>
<div class="stat"><div class="k">현재 연속 실패</div><div id="streak" class="v">0</div></div><div class="stat"><div class="k">최고 연속 실패</div><div id="best" class="v">0</div></div>
<div class="stat"><div class="k">최근 성공까지 걸린 횟수</div><div id="lastGap" class="v">-</div></div><div class="stat"><div class="k">성공당 평균 시도 횟수</div><div id="avgGap" class="v">-</div></div>
</div></div>
<div class="card"><label>설정 확률 vs 실제 성공률</label><div class="note">설정 확률: <b id="theory">5%</b> / 실제 성공률: <b id="actual">0%</b></div><div class="bar"><i id="bar"></i></div></div>
<div class="card"><label>기대값</label><div class="grid"><div class="stat"><div class="k">현재 횟수의 기대 성공</div><div id="expected" class="v">0</div></div><div class="stat"><div class="k">다음 성공까지 기대</div><div id="wait" class="v">-</div></div></div><p class="note">기대값은 평균적인 이론값입니다. 성공확률 5%라면 성공까지 평균 20회가 기대되지만, 실제로는 훨씬 빨리 또는 늦게 성공할 수 있습니다.</p></div>
<div class="card"><label>최근 추첨 기록</label><div id="history" class="history"><span class="note">아직 기록이 없습니다.</span></div></div>
</main>
<script>
(function(){
let total=0,wins=0,losses=0,streak=0,best=0,triesSinceSuccess=0,lastGap=null,totalAttemptsToSuccess=0,history=[];
const $=id=>document.getElementById(id);
function p(){let n=parseFloat($('prob').value);if(isNaN(n))n=0;return Math.max(0,Math.min(100,n))}
function update(){const q=p(),actual=total?wins/total*100:0;
$('total').textContent=total;$('wins').textContent=wins;$('losses').textContent=losses;$('rate').textContent=actual.toFixed(2)+'%';$('streak').textContent=streak;$('best').textContent=best;
$('lastGap').textContent=lastGap===null?'-':lastGap+'회';$('avgGap').textContent=wins?(totalAttemptsToSuccess/wins).toFixed(2)+'회':'-';
$('theory').textContent=q+'%';$('actual').textContent=actual.toFixed(2)+'%';$('bar').style.width=Math.min(actual,100)+'%';$('expected').textContent=(total*q/100).toFixed(2);$('wait').textContent=q?(100/q).toFixed(2)+'회':'∞';
$('history').innerHTML=history.length?history.map(x=>'<div class="row"><span>#'+x.n+' · '+(x.ok?'성공까지 '+x.gap+'회':'실패')+'</span><b class="'+(x.ok?'success':'failure')+'">'+(x.ok?'성공':'실패')+'</b></div>').join(''):'<span class="note">아직 기록이 없습니다.</span>'}
function draw(){const ok=Math.random()*100<p();total++;triesSinceSuccess++;if(ok){wins++;lastGap=triesSinceSuccess;totalAttemptsToSuccess+=triesSinceSuccess;triesSinceSuccess=0;streak=0;$('result').textContent='성공! '+lastGap+'번째 시도';$('result').className='result success'}else{losses++;streak++;best=Math.max(best,streak);$('result').textContent='실패';$('result').className='result failure'}
history.unshift({n:total,ok:ok,gap:ok?lastGap:null});if(history.length>100)history.pop();update()}
$('go').onclick=draw;document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{for(let i=0;i<Number(b.dataset.n);i++)draw()});
$('reset').onclick=()=>{total=wins=losses=streak=best=triesSinceSuccess=totalAttemptsToSuccess=0;lastGap=null;history=[];$('result').textContent='대기 중';$('result').className='result';update()};$('prob').oninput=update;update();
})();
</script></body></html>
